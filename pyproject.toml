[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guess-sheet-headers"
version = "0.9.0"
description = "Heuristic header row range detection for Excel-like two-dimensional data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "rockswang" }
]
keywords = ["excel", "spreadsheet", "header", "heuristic", "table"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Typing :: Typed"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rockswang/guess-sheet-headers"
Issues = "https://github.com/rockswang/guess-sheet-headers/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
